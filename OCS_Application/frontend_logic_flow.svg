</g>

<!-- ================= column 3: logic ================= -->
<!-- logic box helper: x 820..1250 -->
<g>
 <rect x="820" y="140" width="430" height="66" rx="8" class="lg"/>
 <text x="836" y="163" class="t">⓪ Rendering pipeline <tspan fill="#8b949e" font-size="12" font-weight="normal">(also covers ④)</tspan></text>
 <text x="836" y="181" class="s">one frame clock; predicts between samples, 15 ms smoothing,</text>
 <text x="836" y="197" class="f">frameClock.ts · attitude.ts</text>

 <rect x="820" y="218" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="240" class="t">⑤ HUD geometry</text><text x="1000" y="240" class="s">pitch ladder, heading tape, colours</text>
 <text x="836" y="259" class="f">hudDraw.ts (port of Mission Planner's HUD)</text>

 <rect x="820" y="290" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="312" class="t">② Update gate</text><text x="975" y="312" class="s">at most 10 screen updates/s, latest wins</text>
 <text x="836" y="331" class="f">gate.ts</text>

 <rect x="820" y="362" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="384" class="t">① Binding map</text><text x="975" y="384" class="s">which telemetry field goes on which tile</text>
 <text x="836" y="403" class="f">bindings.ts · currentState.ts · autonomy.ts (AUTO / MANUAL)</text>

 <rect x="820" y="434" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="456" class="t">⑩ Units</text><text x="925" y="456" class="s">m/s ↔ kph · kts · mph · fps, m ↔ ft (display only)</text>
 <text x="836" y="475" class="f">units.ts · UnitsSelect.svelte</text>

 <rect x="820" y="506" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="528" class="t">⑥ Warning thresholds</text><text x="1028" y="528" class="s">battery, GPS, EKF, vibration…</text>
 <text x="836" y="547" class="f">warnings.ts (exact Mission Planner rules)</text>

 <rect x="820" y="578" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="600" class="t">⑦ Message severity</text><text x="1010" y="600" class="s">red / yellow / white, message log</text>
 <text x="836" y="619" class="f">severity.ts</text>

 <rect x="820" y="650" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="672" class="t">⑧ Liveness</text><text x="945" y="672" class="s">LIVE · STALE · OFFLINE, NOT LIVE overlay</text>
 <text x="836" y="691" class="f">sources.ts · source.ts · ConnectBar.svelte</text>

 <rect x="820" y="722" width="430" height="52" rx="8" class="lg"/>
 <text x="836" y="744" class="t">⑨ Commands</text><text x="950" y="744" class="s">ARM · DISARM · mode, each confirmed</text>
 <text x="836" y="763" class="f">VehicleCommands.svelte · linkB.ts</text>

 <rect x="820" y="794" width="430" height="52" rx="8" class="lg" stroke-dasharray="6 3"/>
 <text x="836" y="816" class="t">⑪ Loop pacing</text><text x="975" y="816" class="s">every timer in one place (MP's main loop)</text>
 <text x="836" y="835" class="f">pacing.ts: gate 100 ms · clock 250 ms · map 300 ms · STALE 2 s</text>

 <rect x="820" y="880" width="430" height="66" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
 <text x="836" y="903" class="t">OCS view</text><text x="920" y="903" class="s">no logic number: shown as the OCS sends it</text>
 <text x="836" y="921" class="s">course, geofence, Task 4 items, run, preflight</text>
 <text x="836" y="937" class="f">ocs.ts · linkC.ts · mapModel.ts (10 m checks)</text>
</g>

