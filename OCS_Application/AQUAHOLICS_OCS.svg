<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif">
<title>AQUAHOLICS OCS - system wiring</title>
<defs>
 <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker>
 <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
 <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
 <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a64a"/></marker>
 <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/></marker>
</defs>

<rect width="1400" height="620" fill="#0d1117"/>
<text x="700" y="26" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold">AQUAHOLICS RobotX 2026 OCS: system wiring</text>

<!-- Operator display -->
<rect x="380" y="45" width="760" height="125" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
<text x="760" y="72" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Operator display (browser, kiosk)</text>
<g font-size="13" fill="#e6edf3" text-anchor="middle">
 <rect x="398" y="92" width="160" height="56" rx="6" fill="#0d1117" stroke="#30363d"/>
 <text x="478" y="118">Vehicle cards</text><text x="478" y="136" font-size="11" fill="#8b949e">state · alerts · commands</text>
 <rect x="572" y="92" width="130" height="56" rx="6" fill="#0d1117" stroke="#30363d"/>
 <text x="637" y="118">HUD</text><text x="637" y="136" font-size="11" fill="#8b949e">attitude 20 Hz</text>
 <rect x="716" y="92" width="150" height="56" rx="6" fill="#0d1117" stroke="#30363d"/>
 <text x="791" y="118">Map</text><text x="791" y="136" font-size="11" fill="#8b949e">course · Task 4 · vehicles</text>
 <rect x="880" y="92" width="242" height="56" rx="6" fill="#0d1117" stroke="#30363d"/>
 <text x="1001" y="118">RoboCommand panel</text><text x="1001" y="136" font-size="11" fill="#8b949e">run · preflight · commands · Task 4</text>
</g>

<!-- Bottom row -->
<rect x="30" y="390" width="170" height="90" rx="10" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
<text x="115" y="428" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Pixhawk</text>
<text x="115" y="448" text-anchor="middle" fill="#8b949e" font-size="12">ArduPilot · USV1 / UAV1</text>

<rect x="300" y="380" width="340" height="110" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
<text x="470" y="418" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">Vehicle backend</text>
<text x="470" y="440" text-anchor="middle" fill="#8b949e" font-size="12">.NET 10 · Mission Planner DLLs</text>
<text x="470" y="458" text-anchor="middle" fill="#8b949e" font-size="12">serves the display on :5080</text>

<rect x="820" y="380" width="260" height="110" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="950" y="418" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">OCS (main.py)</text>
<text x="950" y="440" text-anchor="middle" fill="#8b949e" font-size="12">Python · MQTT + protobuf</text>
<text x="950" y="458" text-anchor="middle" fill="#8b949e" font-size="12">link C feed on :5081</text>

<rect x="1180" y="380" width="190" height="110" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
<text x="1275" y="428" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">RoboCommand</text>
<text x="1275" y="448" text-anchor="middle" fill="#8b949e" font-size="12">course network</text>

<!-- Pixhawk <-> backend: MAVLink over the telemetry radio -->
<line x1="200" y1="420" x2="298" y2="420" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#grey)"/>
<line x1="298" y1="455" x2="202" y2="455" stroke="#c9d1d9" stroke-width="2.5" marker-end="url(#grey)"/>
<text x="250" y="410" text-anchor="middle" fill="#c9d1d9" font-size="11">MAVLink</text>
<text x="250" y="474" text-anchor="middle" fill="#c9d1d9" font-size="11">commands</text>
<text x="250" y="510" text-anchor="middle" fill="#8b949e" font-size="11">telemetry radio</text>

<!-- Backend -> OCS: link A -->
<line x1="640" y1="435" x2="818" y2="435" stroke="#e0a64a" stroke-width="3" marker-end="url(#orange)"/>
<text x="730" y="422" text-anchor="middle" fill="#e0a64a" font-size="13" font-weight="bold">link A</text>
<text x="730" y="455" text-anchor="middle" fill="#e0a64a" font-size="11">WebSocket /linka</text>
<text x="730" y="470" text-anchor="middle" fill="#e0a64a" font-size="11">heartbeat data 2 Hz</text>

<!-- OCS <-> RoboCommand: MQTT -->
<line x1="1080" y1="415" x2="1178" y2="415" stroke="#d2a8ff" stroke-width="2.5" marker-end="url(#purple)"/>
<line x1="1178" y1="462" x2="1082" y2="462" stroke="#d2a8ff" stroke-width="2.5" marker-end="url(#purple)"/>
<text x="1130" y="406" text-anchor="middle" fill="#d2a8ff" font-size="11">MQTT</text>
<text x="1130" y="508" text-anchor="middle" fill="#d2a8ff" font-size="11">heartbeats, Task 4 replies →</text>
<text x="1130" y="524" text-anchor="middle" fill="#d2a8ff" font-size="11">← Task 4 commands, RunStart</text>

<!-- Backend <-> display: link B -->
<line x1="440" y1="378" x2="440" y2="172" stroke="#58a6ff" stroke-width="3" marker-end="url(#blue)"/>
<line x1="500" y1="172" x2="500" y2="378" stroke="#58a6ff" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#blue)"/>
<text x="430" y="262" text-anchor="end" fill="#58a6ff" font-size="13" font-weight="bold">link B</text>
<text x="430" y="280" text-anchor="end" fill="#58a6ff" font-size="11">WebSocket /linkb</text>
<text x="430" y="296" text-anchor="end" fill="#58a6ff" font-size="11">telemetry</text>
<text x="510" y="280" fill="#58a6ff" font-size="11">cmd (arm / mode)</text>

<!-- OCS <-> display: link C -->
<line x1="920" y1="378" x2="920" y2="172" stroke="#3fb950" stroke-width="3" marker-end="url(#green)"/>
<line x1="980" y1="172" x2="980" y2="378" stroke="#3fb950" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#green)"/>
<text x="910" y="262" text-anchor="end" fill="#3fb950" font-size="13" font-weight="bold">link C</text>
<text x="910" y="280" text-anchor="end" fill="#3fb950" font-size="11">SSE /linkc</text>
<text x="910" y="296" text-anchor="end" fill="#3fb950" font-size="11">state / log</text>
<text x="990" y="280" fill="#3fb950" font-size="11">POST /task4/ready</text>

<!-- Legend -->
<g font-size="12" fill="#8b949e">
 <line x1="40" y1="580" x2="80" y2="580" stroke="#8b949e" stroke-width="3"/><text x="88" y="584">data flow</text>
 <line x1="180" y1="580" x2="220" y2="580" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 4"/><text x="228" y="584">operator action (confirmed in a dialog)</text>
 <text x="1360" y="584" text-anchor="end">All local to the OCS laptop except the telemetry radio and RoboCommand</text>
</g>
</svg>
