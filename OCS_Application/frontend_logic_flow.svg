<!-- legend -->
<rect x="20" y="1062" width="1760" height="120" rx="8" fill="#0d1117" stroke="#30363d"/>
<g font-size="12.5" fill="#c9d1d9">
 <line x1="40" y1="1090" x2="80" y2="1090" stroke="#58a6ff" stroke-width="2" marker-end="url(#b)"/><text x="88" y="1094">vehicle data (link B, from the C# backend)</text>
 <line x1="400" y1="1090" x2="440" y2="1090" stroke="#3fb950" stroke-width="2" marker-end="url(#gr)"/><text x="448" y="1094">OCS data (link C, from main.py)</text>
 <line x1="700" y1="1090" x2="740" y2="1090" stroke="#d2a8ff" stroke-width="2" marker-end="url(#p)"/><text x="748" y="1094">logic output to the screen</text>
 <line x1="980" y1="1090" x2="1020" y2="1090" stroke="#8b949e" stroke-width="2" stroke-dasharray="5 3"/><text x="1028" y="1094">operator action going back / pacing (⑪ sets the timers of ⓪ ② ⑧ and the map)</text>
 <text x="40" y="1122">Circled numbers are the logic items of MissionPlanner_dissected/CLAUDE.md. ③ ⑧ ⑨ run in the backend (blue box) and are what the display relies on; ⓪ ① ② ⑤ ⑥ ⑦ ⑩ ⑪ run in the browser.</text>
 <text x="40" y="1144">④ (redraw on change) is covered by ⓪'s frame clock. Safety rule everywhere: a value that is not LIVE is shown dimmed with its age, never as current.</text>
 <text x="40" y="1166">Mock mode (npm run dev:mock) feeds the same stores from mock.ts instead of links B and C, with a MOCK DATA banner; it never ships in a production build.</text>
</g>
</svg>
