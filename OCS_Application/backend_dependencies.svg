<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif">
<title>Vehicle backend (OcsBackend) - dependency graph</title>
<defs>
 <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a64a"/></marker>
 <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
 <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
 <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker>
 <style>
  .box{fill:#161b22;stroke:#58a6ff;stroke-width:2}
  .leaf{fill:#161b22;stroke:#8b949e;stroke-width:2}
  .ext{fill:#0d1117;stroke:#c9d1d9;stroke-width:2;stroke-dasharray:6 4}
  .t{fill:#e6edf3;font-size:15px;font-weight:bold}
  .s{fill:#8b949e;font-size:11.5px}
  .e{fill:none;stroke:#8b949e;stroke-width:1.8}
  .m{fill:none;stroke:#e0a64a;stroke-width:2.5}
  .mp{fill:#e0a64a;font-size:10px;font-weight:bold}
 </style>
</defs>
<rect width="1600" height="1120" fill="#0d1117"/>
<text x="800" y="32" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Vehicle backend (OcsBackend, C# / .NET 10): dependency graph</text>
<text x="800" y="54" text-anchor="middle" fill="#8b949e" font-size="13">An arrow A → B means "A uses B". Top: entry point and servers. Bottom: the Mission Planner DLLs, drawn as one block.</text>

<!-- external clients -->
<rect x="40" y="76" width="230" height="56" rx="8" class="ext"/>
<text x="155" y="100" text-anchor="middle" class="t">Operator display</text><text x="155" y="118" text-anchor="middle" class="s">browser · link B</text>
<rect x="300" y="76" width="230" height="56" rx="8" class="ext"/>
<text x="415" y="100" text-anchor="middle" class="t">OCS main.py</text><text x="415" y="118" text-anchor="middle" class="s">Python · link A</text>
<path d="M155,132 C155,180 220,190 230,218" class="e" stroke="#58a6ff" marker-end="url(#b)"/>
<text x="120" y="182" fill="#58a6ff" font-size="11">WebSocket /linkb</text>
<path d="M415,132 C415,180 470,190 480,218" class="e" stroke="#3fb950" marker-end="url(#gr)"/>
<text x="430" y="170" fill="#3fb950" font-size="11">WebSocket /linka</text>

<!-- .NET note -->
<rect x="1070" y="72" width="490" height="78" rx="8" class="ext"/>
<text x="1315" y="96" text-anchor="middle" class="t">.NET 10 framework (not drawn as edges)</text>
<text x="1315" y="116" text-anchor="middle" class="s">ASP.NET Core / Kestrel + WebSockets: LinkBServer, LinkBHub, LinkA, Mailbox</text>
<text x="1315" y="133" text-anchor="middle" class="s">System.Text.Json: messages, settings · System.IO.Ports, log4net, Newtonsoft (packages)</text>

<!-- Program -->
<rect x="590" y="78" width="420" height="84" rx="8" class="box"/>
<text x="800" y="104" text-anchor="middle" class="t">Program.cs</text>
<text x="800" y="124" text-anchor="middle" class="s">entry point · vehicle slots USV1 / UAV1 · startup checks</text>
<text x="800" y="141" text-anchor="middle" class="s">(StreamRates: MP re-request off; unit multipliers = 1) · saved ports</text>
<text x="996" y="94" text-anchor="end" class="mp">MP</text>

<!-- row 1 -->
<rect x="170" y="220" width="380" height="80" rx="8" class="box"/>
<text x="360" y="246" text-anchor="middle" class="t">LinkBServer.cs</text>
<text x="360" y="266" text-anchor="middle" class="s">Kestrel web server on :5080 · /linkb · /linka</text>
<text x="360" y="283" text-anchor="middle" class="s">serves the display files · Origin check</text>

<rect x="1110" y="220" width="360" height="80" rx="8" class="box"/>
<text x="1290" y="246" text-anchor="middle" class="t">VehicleSlots.cs</text>
<text x="1290" y="266" text-anchor="middle" class="s">serial port list (/dev/serial/by-id, COM)</text>
<text x="1290" y="283" text-anchor="middle" class="s">saved connections (vehicles.json)</text>
<text x="1456" y="236" text-anchor="end" class="mp">MP</text>

<!-- row 2 -->
<rect x="170" y="370" width="380" height="80" rx="8" class="box"/>
<text x="360" y="396" text-anchor="middle" class="t">LinkBHub.cs</text>
<text x="360" y="416" text-anchor="middle" class="s">link B: telemetry out to every display</text>
<text x="360" y="433" text-anchor="middle" class="s">commands + connect / disconnect in</text>
<text x="536" y="386" text-anchor="end" class="mp">MP</text>

<rect x="620" y="370" width="360" height="80" rx="8" class="box"/>
<text x="800" y="396" text-anchor="middle" class="t">LinkA.cs</text>
<text x="800" y="416" text-anchor="middle" class="s">LinkAHub + LinkAMessages: heartbeat</text>
<text x="800" y="433" text-anchor="middle" class="s">data for main.py, 2 Hz, only while LIVE</text>
<text x="966" y="386" text-anchor="end" class="mp">MP</text>

<!-- row 3 -->
<rect x="130" y="520" width="260" height="80" rx="8" class="leaf"/>
<text x="260" y="546" text-anchor="middle" class="t">LinkBMessages.cs</text>
<text x="260" y="566" text-anchor="middle" class="s">JSON shapes: att, status, params,</text>
<text x="260" y="583" text-anchor="middle" class="s">statustext, backend, modes, cmdack</text>
<text x="376" y="536" text-anchor="end" class="mp">MP</text>

<rect x="440" y="520" width="260" height="80" rx="8" class="leaf"/>
<text x="570" y="546" text-anchor="middle" class="t">Mailbox.cs</text>
<text x="570" y="566" text-anchor="middle" class="s">per-client queue, latest wins,</text>
<text x="570" y="583" text-anchor="middle" class="s">WebSocket send / receive pump</text>

<rect x="780" y="520" width="260" height="80" rx="8" class="leaf"/>
<text x="910" y="546" text-anchor="middle" class="t">RobotState.cs</text>
<text x="910" y="566" text-anchor="middle" class="s">AUTO / MANUAL / UNKNOWN,</text>
<text x="910" y="583" text-anchor="middle" class="s">flight phase (= autonomy.ts)</text>

<!-- row 4 -->
<rect x="560" y="670" width="480" height="84" rx="8" class="box" stroke-width="3"/>
<text x="800" y="697" text-anchor="middle" class="t">VehicleLink.cs (one per vehicle)</text>
<text x="800" y="717" text-anchor="middle" class="s">connect (MP Open) · read loop · LIVE / LOST / OFF · GCS heartbeat 1 Hz</text>
<text x="800" y="734" text-anchor="middle" class="s">events: packets, params, status texts, command results, modes</text>
<text x="1026" y="686" text-anchor="end" class="mp">MP</text>

<!-- row 5 -->
<rect x="330" y="820" width="280" height="70" rx="8" class="leaf"/>
<text x="470" y="846" text-anchor="middle" class="t">StreamRates.cs</text>
<text x="470" y="866" text-anchor="middle" class="s">logic 3: stream group rates</text>

<rect x="660" y="820" width="280" height="70" rx="8" class="leaf"/>
<text x="800" y="846" text-anchor="middle" class="t">BatteryParams.cs</text>
<text x="800" y="866" text-anchor="middle" class="s">the 5 BATT_* params (logic 6)</text>

<rect x="990" y="820" width="280" height="70" rx="8" class="leaf"/>
<text x="1130" y="846" text-anchor="middle" class="t">VehicleCommands.cs</text>
<text x="1130" y="866" text-anchor="middle" class="s">logic 9: arm / disarm / mode</text>

<!-- MP block -->
<rect x="80" y="950" width="1220" height="110" rx="10" fill="#1f1a10" stroke="#e0a64a" stroke-width="2.5"/>
<text x="690" y="976" text-anchor="middle" fill="#e0a64a" font-size="16" font-weight="bold">Mission Planner DLLs (one block; their own dependencies not shown)</text>
<text x="690" y="999" text-anchor="middle" fill="#e6edf3" font-size="12.5">MissionPlanner.ArduPilot.dll: MAVLinkInterface (Open, readPacket, sendPacket, requestDatastream, GetParam,</text>
<text x="690" y="1017" text-anchor="middle" fill="#e6edf3" font-size="12.5">translateMode, generatePacket) · CurrentState (all telemetry fields) · Common.getModesList</text>
<text x="690" y="1037" text-anchor="middle" fill="#e6edf3" font-size="12.5">MAVLink.dll: message structs · MissionPlanner.Comms.dll: SerialPort</text>

<!-- Pixhawk -->
<rect x="1350" y="965" width="210" height="80" rx="8" class="ext"/>
<text x="1455" y="996" text-anchor="middle" class="t">Pixhawk</text><text x="1455" y="1016" text-anchor="middle" class="s">ArduPilot · USB / radio</text>
<line x1="1302" y1="1005" x2="1348" y2="1005" stroke="#c9d1d9" stroke-width="2" marker-end="url(#w)" marker-start="url(#w)"/>
<text x="1325" y="996" text-anchor="middle" fill="#c9d1d9" font-size="10">MAVLink</text>

<!-- edges: Program -->
<path d="M700,162 C640,195 470,195 420,218" class="e" marker-end="url(#g)"/>
<path d="M900,162 C980,195 1200,195 1250,218" class="e" marker-end="url(#g)"/>
<path d="M800,162 L800,368" class="e" marker-end="url(#g)"/>
<path d="M640,162 C640,330 600,400 553,405" class="e" marker-end="url(#g)"/>
<path d="M1010,140 C1085,150 1085,640 1043,700" class="e" marker-end="url(#g)"/>

<!-- edges: servers and hubs -->
<path d="M360,300 L360,368" class="e" marker-end="url(#g)"/>
<path d="M500,300 C560,330 640,340 680,368" class="e" marker-end="url(#g)"/>
<path d="M553,385 C640,335 1000,335 1180,302" class="e" marker-end="url(#g)"/>
<path d="M290,450 L275,518" class="e" marker-end="url(#g)"/>
<path d="M470,450 C500,480 530,495 545,518" class="e" marker-end="url(#g)"/>
<path d="M415,450 L415,620 C415,690 480,712 558,712" class="e" marker-end="url(#g)"/>
<path d="M640,445 C560,470 450,475 393,535" class="e" marker-end="url(#g)"/>
<path d="M700,450 L640,518" class="e" marker-end="url(#g)"/>
<path d="M880,450 L900,518" class="e" marker-end="url(#g)"/>
<path d="M980,425 C1065,450 1065,630 1020,668" class="e" marker-end="url(#g)"/>
<path d="M1290,300 L1290,640 C1290,700 1120,718 1043,718" class="e" marker-end="url(#g)"/>

<!-- edges: VehicleLink to its parts -->
<path d="M700,754 L520,818" class="e" marker-end="url(#g)"/>
<path d="M800,754 L800,818" class="e" marker-end="url(#g)"/>
<path d="M900,754 L1080,818" class="e" marker-end="url(#g)"/>

<!-- edges into Mission Planner -->
<path d="M470,890 L470,948" class="m" marker-end="url(#o)"/>
<path d="M800,890 L800,948" class="m" marker-end="url(#o)"/>
<path d="M1130,890 L1130,948" class="m" marker-end="url(#o)"/>
<path d="M560,725 C260,760 240,900 250,948" class="m" marker-end="url(#o)"/>
<text x="268" y="790" fill="#e0a64a" font-size="11">the vehicle connection</text>

<!-- legend -->
<g font-size="12" fill="#8b949e">
 <line x1="80" y1="1090" x2="120" y2="1090" stroke="#8b949e" stroke-width="2" marker-end="url(#g)"/><text x="128" y="1094">uses (our code)</text>
 <line x1="260" y1="1090" x2="300" y2="1090" stroke="#e0a64a" stroke-width="2.5" marker-end="url(#o)"/><text x="308" y="1094">calls the Mission Planner DLLs</text>
 <text x="520" y="1094"><tspan fill="#e0a64a" font-weight="bold">MP</tspan> tag on a box: that file also uses MP types (CurrentState, MAVLink structs)</text>
 <rect x="1060" y="1080" width="22" height="16" rx="3" class="leaf"/><text x="1090" y="1094">no dependency on other files of ours</text>
 <text x="1520" y="1094" text-anchor="end">Type-only references (records) not drawn</text>
</g>
</svg>
