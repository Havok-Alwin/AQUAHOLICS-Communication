<!-- ================= column 4: panels ================= -->
<g>
 <rect x="1380" y="124" width="390" height="62" rx="8" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
 <text x="1396" y="148" class="t">Top bar</text>
 <text x="1396" y="168" class="s">Vehicle backend / OCS badges · units choice</text>

 <rect x="1380" y="200" width="390" height="92" rx="8" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
 <text x="1396" y="224" class="t">HUD</text>
 <text x="1396" y="244" class="s">artificial horizon, heading, speed, altitude</text>
 <text x="1396" y="262" class="s">NOT LIVE overlay when the data stops</text>

 <rect x="1380" y="306" width="390" height="300" rx="8" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
 <text x="1396" y="330" class="t">Vehicle card (one per vehicle)</text>
 <g class="s">
  <text x="1396" y="354">• Connect bar: port, baud, Connect / Disconnect</text>
  <text x="1396" y="378">• robot state AUTO / MANUAL, mode, flight phase</text>
  <text x="1396" y="402">• alerts: only when something is wrong</text>
  <text x="1396" y="426">• tiles: battery, GPS, link, speed, heading,</text>
  <text x="1406" y="442">  altitude (UAV) or distance to waypoint (USV)</text>
  <text x="1396" y="466">• vehicle message line + Messages log</text>
  <text x="1396" y="490">• ARM · DISARM · mode buttons</text>
  <text x="1396" y="514">• "All telemetry" (the full binding table)</text>
  <text x="1396" y="538">• LIVE / STALE / OFFLINE badge, link problem</text>
 </g>

 <rect x="1380" y="640" width="390" height="120" rx="8" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
 <text x="1396" y="664" class="t">Map</text>
 <text x="1396" y="686" class="s">vehicles + tracks, course, UAV geofence,</text>
 <text x="1396" y="704" class="s">keep-out zones, moving object + 10 m ring,</text>
 <text x="1396" y="722" class="s">red banner when a vehicle is too close</text>
 <text x="1396" y="742" class="f">vehicle positions: status snapshot (②) · heading: ⓪</text>

 <rect x="1380" y="800" width="390" height="150" rx="8" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
 <text x="1396" y="824" class="t">RoboCommand panel</text>
 <text x="1396" y="846" class="s">connection, run, preflight checklist,</text>
 <text x="1396" y="864" class="s">heartbeats per vehicle, command log,</text>
 <text x="1396" y="882" class="s">Task 4 items and their replies,</text>
 <text x="1396" y="900" class="s">Report ready button</text>
</g>

