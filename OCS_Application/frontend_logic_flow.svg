<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif">
<title>Operator display - how logics 0 to 11 connect the backends to the screen</title>
<defs>
 <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
 <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
 <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a64a"/></marker>
 <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/></marker>
 <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2a8ff"/></marker>
 <style>
  .t{fill:#e6edf3;font-size:15px;font-weight:bold}
  .s{fill:#8b949e;font-size:11.5px}
  .f{fill:#6e7681;font-size:10.5px;font-style:italic}
  .hdr{fill:#e6edf3;font-size:16px;font-weight:bold}
  .lg{fill:#161b22;stroke:#d2a8ff;stroke-width:2}
  .pill{stroke-width:1.5}
  .eb{fill:none;stroke:#58a6ff;stroke-width:2}
  .eg{fill:none;stroke:#3fb950;stroke-width:2}
  .ep{fill:none;stroke:#d2a8ff;stroke-width:2}
  .ed{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:3 4}
 </style>
</defs>
<rect width="1800" height="1200" fill="#0d1117"/>
<text x="900" y="32" text-anchor="middle" fill="#e6edf3" font-size="21" font-weight="bold">Operator display: how logics 0–11 turn backend data into what the operator sees</text>
<text x="900" y="56" text-anchor="middle" fill="#8b949e" font-size="13">Read left to right: where the data comes from → the message that carries it → the logic that shapes it → the panel that shows it.</text>

<!-- column headers -->
<g class="hdr" text-anchor="middle">
 <text x="185" y="96">1. Where data comes from</text>
 <text x="570" y="96">2. Messages</text>
 <text x="1035" y="96">3. Frontend logic (numbers = CLAUDE.md table)</text>
 <text x="1560" y="96">4. What the operator sees</text>
</g>
<line x1="20" y1="108" x2="1780" y2="108" stroke="#30363d"/>

<!-- ================= column 1: sources ================= -->
<rect x="30" y="124" width="310" height="52" rx="8" fill="#0d1117" stroke="#c9d1d9" stroke-width="2" stroke-dasharray="6 4"/>
<text x="185" y="148" text-anchor="middle" class="t">Pixhawk (ArduPilot)</text><text x="185" y="166" text-anchor="middle" class="s">USV1 · UAV1 · USB or telemetry radio</text>
<line x1="185" y1="176" x2="185" y2="200" stroke="#c9d1d9" stroke-width="2" marker-end="url(#w)" marker-start="url(#w)"/>

<rect x="30" y="202" width="310" height="390" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/>
<text x="185" y="228" text-anchor="middle" class="t">Vehicle backend (C#)</text>
<text x="185" y="246" text-anchor="middle" class="s">Mission Planner DLL: MAVLinkInterface + CurrentState</text>
<g font-size="12.5" fill="#e6edf3">
 <text x="48" y="282"><tspan fill="#58a6ff" font-weight="bold">③ Stream rates</tspan></text>
 <text x="48" y="299" class="s">asks the vehicle for attitude 20 Hz,</text>
 <text x="48" y="314" class="s">status groups 2 Hz</text>
 <text x="48" y="342"><tspan fill="#58a6ff" font-weight="bold">⑧ Connect / link-lost</tspan></text>
 <text x="48" y="359" class="s">Connect from the card · LIVE · LOST · OFF</text>
 <text x="48" y="374" class="s">status sent only while LIVE</text>
 <text x="48" y="402"><tspan fill="#58a6ff" font-weight="bold">⑨ Commands (executes)</tspan></text>
 <text x="48" y="419" class="s">arm · disarm · mode → COMMAND_LONG, waits ack</text>
 <text x="48" y="447"><tspan fill="#58a6ff" font-weight="bold">⑥ Battery limits</tspan></text>
 <text x="48" y="464" class="s">fetches the 5 BATT_* parameters</text>
 <text x="48" y="492"><tspan fill="#58a6ff" font-weight="bold">⑦ Vehicle messages</tspan></text>
 <text x="48" y="509" class="s">every STATUSTEXT, with its severity</text>
 <text x="48" y="537"><tspan fill="#58a6ff" font-weight="bold">⑩ Units stay SI</tspan></text>
 <text x="48" y="554" class="s">m, m/s (refuses to start otherwise);</text>
 <text x="48" y="569" class="s">converting is the display's job</text>
</g>

<rect x="110" y="742" width="230" height="52" rx="8" fill="#0d1117" stroke="#c9d1d9" stroke-width="2" stroke-dasharray="6 4"/>
<text x="225" y="766" text-anchor="middle" class="t">RoboCommand</text><text x="225" y="784" text-anchor="middle" class="s">competition server · MQTT</text>
<line x1="225" y1="794" x2="225" y2="818" stroke="#c9d1d9" stroke-width="2" marker-end="url(#w)" marker-start="url(#w)"/>

<rect x="30" y="820" width="310" height="200" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
<text x="185" y="846" text-anchor="middle" class="t">OCS (main.py)</text>
<text x="185" y="864" text-anchor="middle" class="s">Python · talks to RoboCommand</text>
<g font-size="12" fill="#e6edf3">
 <text x="48" y="892">• connection, run, preflight checklist</text>
 <text x="48" y="914">• course boundary + UAV geofence</text>
 <text x="48" y="936">• Task 4: keep-out zones, moving object,</text>
 <text x="58" y="952">  automatic acks</text>
 <text x="48" y="974">• heartbeats to RoboCommand (from link A,</text>
 <text x="58" y="990">  same AUTO / MANUAL rules as the card)</text>
</g>
<path d="M60,592 L60,816" fill="none" stroke="#e0a64a" stroke-width="2.5" marker-end="url(#o)"/>
<text x="72" y="660" fill="#e0a64a" font-size="12" font-weight="bold">link A</text>
<text x="72" y="676" fill="#e0a64a" font-size="11">heartbeat data, 2 Hz</text>

<!-- ================= column 2: messages ================= -->
<text x="570" y="140" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="bold">link B · WebSocket /linkb</text>
<g font-size="12.5">
 <rect x="410" y="150" width="320" height="38" rx="19" fill="#0f2238" stroke="#58a6ff" class="pill"/>
 <text x="430" y="174" fill="#e6edf3"><tspan font-weight="bold">att</tspan><tspan fill="#8b949e">  roll · pitch · yaw, ~20 Hz, on change</tspan></text>
 <rect x="410" y="200" width="320" height="38" rx="19" fill="#0f2238" stroke="#58a6ff" class="pill"/>
 <text x="430" y="224" fill="#e6edf3"><tspan font-weight="bold">status</tspan><tspan fill="#8b949e">  telemetry snapshot, 2 Hz</tspan></text>
 <rect x="410" y="250" width="320" height="38" rx="19" fill="#0f2238" stroke="#58a6ff" class="pill"/>
 <text x="430" y="274" fill="#e6edf3"><tspan font-weight="bold">params</tspan><tspan fill="#8b949e">  battery limits (BATT_*)</tspan></text>
 <rect x="410" y="300" width="320" height="38" rx="19" fill="#0f2238" stroke="#58a6ff" class="pill"/>
 <text x="430" y="324" fill="#e6edf3"><tspan font-weight="bold">statustext</tspan><tspan fill="#8b949e">  vehicle messages</tspan></text>
 <rect x="410" y="350" width="320" height="38" rx="19" fill="#0f2238" stroke="#58a6ff" class="pill"/>
 <text x="430" y="374" fill="#e6edf3"><tspan font-weight="bold">backend</tspan><tspan fill="#8b949e">  link state per vehicle, ports</tspan></text>
 <rect x="410" y="400" width="320" height="38" rx="19" fill="#0f2238" stroke="#58a6ff" class="pill"/>
 <text x="430" y="424" fill="#e6edf3"><tspan font-weight="bold">modes · cmdack</tspan><tspan fill="#8b949e">  mode list, command results</tspan></text>
 <rect x="410" y="450" width="320" height="38" rx="19" fill="#0d1117" stroke="#58a6ff" stroke-dasharray="5 3" class="pill"/>
 <text x="430" y="474" fill="#e6edf3"><tspan font-weight="bold">← cmd · connect</tspan><tspan fill="#8b949e">  from the operator</tspan></text>
</g>

<text x="570" y="850" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold">link C · Server-Sent Events /linkc</text>
<g font-size="12.5">
 <rect x="410" y="860" width="320" height="38" rx="19" fill="#0f2a17" stroke="#3fb950" class="pill"/>
 <text x="430" y="884" fill="#e6edf3"><tspan font-weight="bold">state</tspan><tspan fill="#8b949e">  the whole OCS picture, 1 Hz</tspan></text>
 <rect x="410" y="910" width="320" height="38" rx="19" fill="#0f2a17" stroke="#3fb950" class="pill"/>
 <text x="430" y="934" fill="#e6edf3"><tspan font-weight="bold">log</tspan><tspan fill="#8b949e">  command / error lines</tspan></text>
 <rect x="410" y="960" width="320" height="38" rx="19" fill="#0d1117" stroke="#3fb950" stroke-dasharray="5 3" class="pill"/>
 <text x="430" y="984" fill="#e6edf3"><tspan font-weight="bold">← Report ready</tspan><tspan fill="#8b949e">  Task 4 (POST)</tspan></text>
</g>

